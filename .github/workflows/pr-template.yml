name: Apply release PR template

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  apply-release-template:
    if: startsWith(github.event.pull_request.head.ref, 'releases/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set PR body to release template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file .github/PULL_REQUEST_TEMPLATE/release.md
